时","低GI","高蛋白","营养均衡"]},{"q":"请简述反式脂肪酸的危害及如何识别和避免。","r":"反式脂肪酸危害：易沉积为内脏脂肪（危害最大），吸收转换率高，应坚决杜绝。识别：每100g产品中含量≤0.3g可标注为0，但配料表中有氢化植物油、植脂末、代可可脂、起酥油、人造奶油等12种名称时仍含反式脂肪酸。避免：看到氢化类名字绕着走，选择天然未加工的食品。","k":["反式脂肪酸","内脏脂肪","坚决杜绝","0.3g","氢化","植脂末","代可可脂","配料表"]},{"q":"请简述燃脂运动的三个要素和运动管理的核心要点。","r":"燃脂三要素：1)有氧运动(快走、慢跑、游泳等)；2)强度合适，达到最佳心率((220-年龄-静态心率)×40%~60%+静态心率)；3)每次30分钟以上。运动管理核心：每周150分钟以上中等强度有氧运动；HIIT燃脂效率最高(每次15~20分钟)；快走减肥成功率最高；塑形=减腰围+增臀围，需结合力量训练。","k":["有氧运动","最佳心率","30分钟","150分钟","HIIT","快走","塑形","力量训练"]},{"q":"请简述影响减肥的心理因素及管理策略。","r":"心理因素管理包括三方面：1)压力管理三对策——制定小目标、自我监测(记录饮食和想法)、舒缓宣泄(瑜伽、冥想、每天10~15分钟正念)；2)睡眠三标准——睡够6~8小时、保证深睡、规律作息(睡眠不足使食欲增加45%)；3)社交支持——三度影响力(朋友45%/朋友的朋友20%/朋友的朋友的朋友10%)，构建减肥社交圈，找标杆充分浸染、主动分享。","k":["压力","小目标","自我监测","舒缓宣泄","睡眠","6~8小时","三度影响力","45%","社交圈"]},{"q":"请比较代餐、减肥药和减肥手术三种辅助工具的适用条件和注意事项。","r":"代餐：安全有效，每餐150~350大卡，可代替1~2顿饭，但不能代替所有饮食，形成自己的生活方式前不能停。减肥药：保健品几乎无效；奥利司他是国家唯一批准的减肥药(减30%脂肪吸收)；GLP-1RA效果最好副作用最小(减重10%)；使用门槛BMI≥27+并发症或BMI≥30且生活方式干预无效。手术：抽脂不减肥；真正的手术有胃旁路、袖状胃切除、胃气球；适应症BMI>32.5(糖尿病)或>40(无糖尿病)。所有辅助工具最终都要回归生活方式干预。","k":["代餐","150~350","GLP-1RA","奥利司他","BMI≥27","BMI≥30","胃旁路","抽脂","生活方式干预"]},{"q":"请解释三度影响力理论及其在减肥社交圈构建中的应用。","r":"三度影响力：你的朋友变胖使你变胖的概率是45%，朋友的朋友是20%，朋友的朋友的朋友是10%。这说明肥胖具有社交传染性。应用：在家人、朋友、网络社群中找几个标杆构建减肥社交圈；充分浸染——凡是和减肥相关的行动都尽量泡进去；主动分享——凡是和减肥相关的内容都主动和圈子里的朋友分享。同伴一起减肥成功率可比独自减肥高出三成。","k":["三度影响力","45%","20%","10%","社交圈","浸染","分享","同伴"]},{"q":"请简述反式脂肪酸的12种常见别名，为什么它在配料表中难以识别？","o":["氢化植物油","植脂末","代可可脂","起酥油","人造奶油","植物黄油","精炼植物油","氢化脂肪","氢化棕榈油","起酥油","人造黄油","植物奶油"],"k":["反式脂肪酸","12种","别名","氢化","配料表","识别"],"r":"12种常见别名包括：氢化植物油、植脂末、代可可脂、起酥油、人造奶油、植物黄油、精炼植物油、氢化脂肪、氢化棕榈油、人造黄油、植物奶油、起酥油。难以识别是因为它们分散在配料表中，且反式脂肪酸含量≤0.3g/100g可标注为0。"},{"q":"为什么说减肥的本质是换一种活法？请结合全书核心论点阐述。","r":"因为：1)减肥失败率99.5%说明不是单靠毅力能决定的；2)肥胖由生活方式决定，减肥必须进行生活方式干预(饮食+运动+心理金三角)；3)短期极端方法(节食/单纯运动)会导致82%以上反弹率，只有把科学减肥方法变成日常习惯才能真正成功；4)需要同时满足主观动力(美丽+健康)和客观动力(身体机能+生理满足)；5)66天固化新习惯后，全新的生活方式就形成了——这就是换一种活法。","k":["99.5%","毅力","生活方式干预","金三角","82%","反弹","66天","换一种活法"]}]};

  var h="";var n=0;
  h+="<div class=\"sec-title\"><span>一、单选题</span><span class=\"pt\">10题×3分=30分</span></div>";
  curQ.s.forEach(function(q,i){
    n++;var id="s_"+i;
    h+="<div class=\"q-card\"><div class=\"q-text\"><span class=\"q-num\">"+n+".</span>"+esc(q.q)+"<span class=\"q-pts\">(3分)</span></div><div class=\"opts\" id=\"o_"+id+"\">";
    q.o.forEach(function(o,oi){var l=String.fromCharCode(65+oi);h+="<label onclick=\"selS("+i+","+oi+")\"><input type=\"radio\" name=\""+id+"\" value=\""+oi+"\"><span>"+l+". "+esc(o)+"</span></label>";});
    h+="</div></div>";
  });
  h+="<div class=\"sec-title\"><span>二、多选题</span><span class=\"pt\">5题×4分=20分</span></div>";
  curQ.m.forEach(function(q,i){
    n++;var id="m_"+i;
    h+="<div class=\"q-card\"><div class=\"q-text\"><span class=\"q-num\">"+n+".</span>"+esc(q.q)+"<span class=\"q-pts\">(4分)</span></div><div class=\"opts\" id=\"o_"+id+"\">";
    q.o.forEach(function(o,oi){var l=String.fromCharCode(65+oi);h+="<label onclick=\"togM("+i+","+oi+")\"><input type=\"checkbox\"><span>"+l+". "+esc(o)+"</span></label>";});
    h+="</div></div>";
  });
  h+="<div class=\"sec-title\"><span>三、填空题</span><span class=\"pt\">10题×3分=30分</span></div>";
  curQ.f.forEach(function(q,i){
    n++;var id="f_"+i;
    h+="<div class=\"q-card\"><div class=\"q-text\"><span class=\"q-num\">"+n+".</span>"+esc(q.q)+"<span class=\"q-pts\">(3分)</span></div><input class=\"fi\" id=\"i_"+id+"\" type=\"text\" placeholder=\"请输入答案...\" oninput=\"fill("+i+")\"></div>";
  });
  h+="<div class=\"sec-title\"><span>四、简答题</span><span class=\"pt\">1题×20分=20分</span></div>";
  curQ.h.forEach(function(q,i){
    n++;
    h+="<div class=\"q-card\"><div class=\"q-text\"><span class=\"q-num\">"+n+".</span>"+esc(q.q)+"<span class=\"q-pts\">(20分)</span></div><textarea id=\"i_h_"+i+"\" placeholder=\"请输入你的回答（至少10个字）...\" oninput=\"shortA("+i+")\"></textarea></div>";
  });
  app.innerHTML=h;
}

function selS(i,oi){if(done)return;ans["s_"+i]=[oi];var ls=document.querySelectorAll("#o_s_"+i+" label");ls.forEach(function(el,idx){el.classList.toggle("sel",idx===oi);});upd();}
function togM(i,oi){if(done)return;if(!ans["m_"+i])ans["m_"+i]=[];var a=ans["m_"+i];var idx=a.indexOf(oi);if(idx===-1)a.push(oi);else a.splice(idx,1);var ls=document.querySelectorAll("#o_m_"+i+" label");ls.forEach(function(el,idx2){el.classList.toggle("sel",a.indexOf(idx2)!==-1);});upd();}
function fill(i){if(done)return;var el=document.getElementById("i_f_"+i);ans["f_"+i]=el?el.value.trim():"";upd();}
function shortA(i){if(done)return;var el=document.getElementById("i_h_"+i);ans["h_"+i]=el?el.value.trim():"";upd();}

function upd(){
  var n=0;
  curQ.s.forEach(function(x,i){if(ans["s_"+i]&&ans["s_"+i].length>0)n++;});
  curQ.m.forEach(function(x,i){if(ans["m_"+i]&&ans["m_"+i].length>0)n++;});
  curQ.f.forEach(function(x,i){if(ans["f_"+i]&&ans["f_"+i].length>0)n++;});
  curQ.h.forEach(function(x,i){if(ans["h_"+i]&&ans["h_"+i].length>=10)n++;});
  document.getElementById("answeredCount").textContent=n;
  document.getElementById("submitBtn").disabled=(n<26);
}

function submitQuiz(){
  if(done)return;
  done=true;
  var btn=document.getElementById("submitBtn");
  btn.disabled=true;
  btn.textContent="✅ 已提交";
  try{
    var total=0;
    var dt=[];
    
    curQ.s.forEach(function(q,i){
      var ua=ans["s_"+i]||[];
      var ok=ua.length>0&&ua[0]===q.a;
      if(ok)total+=3;
      var ls=document.querySelectorAll("#o_s_"+i+" label");
      ls.forEach(function(el,oi){
        el.classList.remove("sel");
        if(oi===q.a)el.classList.add("c");
        if(ua.length>0&&ua[0]===oi&&oi!==q.a)el.classList.add("w");
      });
      dt.push({t:"s",q:q.q,ok:ok,pt:ok?3:0,mp:3});
    });
    
    curQ.m.forEach(function(q,i){
      var ua=ans["m_"+i]||[];
      var ok=ua.length===q.a.length;
      if(ok){for(var j=0;j<ua.length;j++){if(q.a.indexOf(ua[j])===-1){ok=false;break;}}}
      if(ok)total+=4;
      var ls=document.querySelectorAll("#o_m_"+i+" label");
      ls.forEach(function(el,oi){
        el.classList.remove("sel");
        if(q.a.indexOf(oi)!==-1)el.classList.add("c");
        if(ua.indexOf(oi)!==-1&&q.a.indexOf(oi)===-1)el.classList.add("w");
      });
      dt.push({t:"m",q:q.q,ok:ok,pt:ok?4:0,mp:4});
    });
    
    curQ.f.forEach(function(q,i){
      var el=document.getElementById("i_f_"+i);
      var ua=el?el.value.trim():"";
      var ok=false;
      if(q.a){for(var j=0;j<q.a.length;j++){if(ua.indexOf(q.a[j])!==-1){ok=true;break;}}}
      if(ok)total+=3;
      if(el){el.classList.add(ok?"c":"w");el.readOnly=true;}
      dt.push({t:"f",q:q.q,ok:ok,pt:ok?3:0,mp:3});
    });
    
    curQ.h.forEach(function(q,i){
      var el=document.getElementById("i_h_"+i);
      var ua=el?el.value.trim():"";
      var mc=0;
      if(q.k&&q.k.length>0){for(var j=0;j<q.k.length;j++){if(ua.indexOf(q.k[j])!==-1)mc++;}}
      var sc=Math.round((mc/Math.max(q.k.length,1))*20);
      if(sc<0)sc=0;if(sc>20)sc=20;
      if(ua.length>=10&&sc<2)sc=2;
      total+=sc;
      if(el)el.readOnly=true;
      dt.push({t:"h",q:q.q,ok:sc>=12,pt:sc,mp:20,ref:q.r});
    });
    
    showResults(total,dt);
  }catch(e){
    alert("提交出错："+e.message);
    done=false;
    btn.disabled=false;
    btn.textContent="📩 重新提交";
  }
}

function showResults(total,dt){
  document.getElementById("app").style.display="none";
  var rb=document.getElementById("resultBox");
  rb.style.display="block";rb.classList.add("show");
  var pass=total>=70;
  var h="";
  h+="<div class=\"result-hdr\">";
  h+="<div class=\"big-score"+(pass?"":" w")+"\">"+total+"<span style=\"font-size:18px;font-weight:400;color:#6b7280\">/100</span></div>";
  h+="<div class=\"score-label\">"+(pass?"🎉 恭喜通过！":"😅 未通过，再接再厉！")+"</div>";
  var ss=0,ms=0,fs=0,hs=0;
  dt.forEach(function(d){if(d.t==="s")ss+=d.pt;if(d.t==="m")ms+=d.pt;if(d.t==="f")fs+=d.pt;if(d.t==="h")hs+=d.pt;});
  h+="<div class=\"score-detail\"><span>单选: "+ss+"/30</span><span>多选: "+ms+"/20</span><span>填空: "+fs+"/30</span><span>简答: "+hs+"/20</span></div>";
  h+="</div><div class=\"analysis-section\">";
  dt.forEach(function(d,i){
    h+="<div class=\"analysis-item\">";
    h+="<div class=\"aq\">"+(i+1)+". "+esc(d.q)+" <span class=\""+(d.ok?"correct-txt":"wrong-txt")+"\">("+d.pt+"/"+d.mp+"分)</span></div>";
    if(d.t==="h"&&d.ref){h+="<div class=\"short-ref\"><strong>参考答案：</strong>"+esc(d.ref)+"</div>";}
    h+="</div>";
  });
  h+="</div>";
  document.getElementById("resultContent").innerHTML=h;
}

function reshuffle(){render();window.scrollTo(0,0);}
render();
</script>
