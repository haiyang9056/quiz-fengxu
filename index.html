olid #dc2626}.ftr{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid #dce6dc;z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,.06)}.ftr-inner{max-width:800px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.ftr-info{font-size:13px;color:#6b7280;line-height:1.4}.ftr-info strong{color:#1a2a1a}.btn{padding:10px 28px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}.btn:active{transform:scale(.97)}.btn-p{background:#1b8a3e;color:#fff}.btn-p:hover{background:#14532d}.btn-p:disabled{opacity:.45;cursor:default}.btn-s{background:#dce6dc;color:#1a2a1a}.btn-s:hover{background:#c8d6c8}.btn-grp{display:flex;gap:8px}.result-box{display:none}.result-box.show{display:block}.result-hdr{text-align:center;padding:28px 16px;background:#fff;border:1px solid #dce6dc;border-radius:12px;margin-bottom:16px}.big-score{font-size:44px;font-weight:800;color:#15803d}.big-score.w{color:#dc2626}.score-label{font-size:14px;color:#6b7280;margin-top:4px}.score-detail{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:12px;color:#6b7280;flex-wrap:wrap}.analysis-section{margin-top:14px}.analysis-item{padding:10px;border:1px solid #dce6dc;border-radius:8px;margin-bottom:6px;font-size:12px;line-height:1.5;background:#fff}.analysis-item .aq{font-weight:500;margin-bottom:3px}.analysis-item .ad{color:#4b5563;margin-top:2px;font-size:12px}.analysis-item .ad .user-ans{color:#2563eb}.analysis-item .ad .corr-ans{color:#15803d}.correct-txt{color:#15803d;font-weight:600}.wrong-txt{color:#dc2626;font-weight:600}@media(max-width:480px){body{padding-bottom:140px}.container{padding:8px}.hdr h1{font-size:17px}.ftr-inner{flex-direction:column;gap:6px}.btn{width:100%}.btn-grp{width:100%}.btn-grp .btn{flex:1}.big-score{font-size:36px}}.ex{margin-top:8px;background:#f4faf4;border:1px solid #d5e8d5;border-left:3px solid #1b8a3e;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.7}.ex-t{color:#14532d;font-weight:700;margin-bottom:3px;display:block}.ex-b{color:#334155}</style></head><body><div class="hdr"><h1>冯雪科学减肥法 · 题库</h1><p>覆盖全书全部内容 | 每次抽60题 | 满分100分 | 70分及格</p><div class="stats"><span>📝 单选152题</span><span>📋 多选47题</span></div></div><div class="container" id="app"></div><div class="result-box" id="resultBox"><div class="container" id="resultContent"></div></div><div class="ftr"><div class="ftr-inner"><div class="ftr-info">已答 <strong id="answeredCount">0</strong>/60 | 得分 <strong id="scoreDisplay">0</strong></div><div class="btn-grp"><button class="btn btn-s" onclick="reshuffle()">🔄 重新抽题</button><button class="btn btn-p" id="submitBtn" onclick="submitQuiz()">📩 提交</button></div></div></div><script>var QB = {"singles":[{"q":"研究表明，减肥一年后复胖的比例高达多少？","o":["50%以上","70%以上","95%以上","99%以上"],"a":2,"e":"研究表明，在减肥一年后，复胖的比例高达95％以上。"},{"q":"从医学角度，肥胖被定义为什么性质的疾病？","o":["急性传染性疾病","慢性渐进性疾病","单纯的心理疾病","遗传性疾病"],"a":1,"e":"从医学上来说，肥胖是一种慢性渐进性疾病，具有很高的复发倾向。"},{"q":"减肥失败者重新开启新一轮减肥时，第一步应该是？","o":["立即加大运动量","找原因","严格节食","购买代餐"],"a":1,"e":"第一步 找原因：'有了这张图，你就可以在里面寻找自己减肥失败的原因了。'【书中三步法以'找原因'为第一步】"},{"q":"对于BMI小于等于35的减肥失败者，6个月减重目标应设定为？","o":["减掉体重的5%~10%","减掉体重的10%~15%","减掉体重的15%~20%","减掉体重的20%以上"],"a":0,"e":"如果你的BMI小于等于35，最好把目标定为6个月内减少现在体重的5%～10%。"},{"q":"对于BMI超过35的减肥失败者，6个月减重目标应设定为？","o":["减掉体重的5%~10%","减掉体重的10%~15%","减掉体重的15%~20%","减掉体重的3%~5%"],"a":1,"e":"如果你的BMI超过35，可以把目标定为6个月内减少体重的10%～15%。"},{"q":"对所有减肥失败者，平均每周减重速度不要超过多少？","o":["0.5千克","1千克","1.5千克","2千克"],"a":0,"e":"对于所有失败过的减肥者，我的建议是，每周称一次体重，平均每周减重不要超过0.5千克。"},{"q":"小满案例中，导致她以往减肥难以维持的优先管理层面是？","o":["饮食管理","运动管理","心理因素管理","睡眠管理"],"a":2,"e":"抑郁症的发生，是让小满体重变化最大的一个因素，而心理因素管理的失败也正是她后面所有减肥尝试都难以维持的原因。"},{"q":"找出减肥失败原因时，只需从哪三个层面中挑选？","o":["饮食、运动、心理因素","睡眠、情绪、工作","药物、手术、代餐","基因、环境、激素"],"a":0,"e":"不用想得很复杂，你只需要在饮食、运动、心理因素这三个层面中挑一个就好。"},{"q":"给小满做心理评估后，医生借助的新工具是？","o":["抗焦虑药物+12次心理治疗","减肥手术","每日代餐","高强度训练营"],"a":0,"e":"于是，我给她开了一些抗焦虑的药物，并且让心理治疗师规律地给她做了12次心理治疗，包括放松、正念进食，等等。"},{"q":"中国人为零食提供了大约多少的总能量摄入？","o":["5%","10%","20%","25%"],"a":1,"e":"最新数据显示，中国是仅次于美国、澳大利亚和墨西哥的零食消费国，零食为中国人提供了大约10％的总能量摄入。"},{"q":"过去一年中至少对一种食物产生过渴望的年轻女性比例是？","o":["70%","85%","100%","90%"],"a":2,"e":"有报告称，100％的年轻女性和70％的年轻男性在过去一年中至少对一种食物产生过渴望。"},{"q":"过去一年中至少对一种食物产生过渴望的年轻男性比例是？","o":["50%","70%","90%","100%"],"a":1,"e":"有报告称，100％的年轻女性和70％的年轻男性在过去一年中至少对一种食物产生过渴望。"},{"q":"成瘾性食物的共同特点不包括？","o":["以碳水化合物为主","混合脂肪","高GI","高蛋白"],"a":3,"e":"研究表明，成瘾性食物存在一些共同特点：以碳水化合物为主、混合脂肪、高GI、深加工。【共同特点中没有'高蛋白'】"},{"q":"需要贴红色标签的零食判断标准中，每100克能量超过多少？","o":["1500千焦","2000千焦（477.8大卡）","2500千焦","3000千焦"],"a":1,"e":"所以，每100克能量超过2000千焦（477.8大卡）的食物，精制碳水化合物占到40％以上且脂肪含量也不低的食物，以及所有的含糖饮料，都需要贴上红色标签。"},{"q":"下列零食中，属于绿色标签的是？","o":["麻辣鸭脖","调味酸奶","不加盐和糖的烘烤坚果","果汁"],"a":2,"e":"什么样的零食可以贴上绿色标签呢？主要包括三类，一类是烘烤坚果，不加盐和糖；一类是奶制品，鲜牛奶、酸奶，不调味；还有一类是完整的水果，或者不加调味品的水果干。"},{"q":"黄色标签零食一周最多吃几次？","o":["1次","2次","3次","5次"],"a":1,"e":"黄色标签的零食可以偶尔吃，一周不要超过两次，每次不要超过50克。"},{"q":"黄色标签零食每次不要超过多少克？","o":["30克","50克","100克","150克"],"a":1,"e":"黄色标签的零食可以偶尔吃，一周不要超过两次，每次不要超过50克。"},{"q":"评价性条件反射训练后，参与者选择水果而非黄油曲奇的可能性是原来的？","o":["2倍","3倍","4倍","5倍"],"a":1,"e":"数据表明，在接受评价性条件反射训练后，参与者选择水果而不是黄油曲奇的可能性，是原来的三倍。"},{"q":"下列属于绿色饮料的是？","o":["含糖奶茶","可乐","无糖苏打水","果汁饮料"],"a":2,"e":"什么是绿色饮料呢？茶、黑咖啡、无糖苏打水，还有牛奶，都算。"},{"q":"点外卖的两个高招不包括？","o":["品种尽量丰富","先喝汤再吃蔬菜然后吃肉最后吃主食","只点打卤面","单加一份沙拉"],"a":2,"e":"不要光点打卤面、盖浇饭这些，不仅蔬菜、蛋白质肯定不够，碳水化合物、油脂也会双双超标。"},{"q":"应酬时的第一选择是？","o":["烧烤","火锅","自助餐","西餐"],"a":1,"e":"①应酬的第一选择：吃火锅。"},{"q":"吃火锅最合适的锅底是？","o":["牛油锅","浓汤锅","清汤锅","麻辣锅"],"a":2,"e":"最合适的是清汤锅，其实就是大葱加水；"},{"q":"吃火锅点菜时，下列哪种食材应尽量不选？","o":["鱼虾","鸡肉","蟹棒","百叶"],"a":2,"e":"蟹棒、鱼豆腐、丸子、虾滑、午餐肉、香肠之类，就尽量不要选了；"},{"q":"辣椒中所含的辣椒素能促进哪种脂肪分解？","o":["白色脂肪","内脏脂肪","皮下脂肪","棕色脂肪"],"a":0,"e":"幸运的是，辣椒中所含的辣椒素能够促进白色脂肪的分解，使其变成棕色脂肪。"},{"q":"约饭时，最不适合大吃大喝的时间段是？","o":["中午12点到下午2点","下午3点到5点","晚上9点到凌晨5点","早上6点到8点"],"a":2,"e":"最不适合大吃大喝的时间，是晚上9点到凌晨5点。"},{"q":"每克酒精含有多少大卡能量？","o":["4大卡","7大卡","9大卡","2大卡"],"a":1,"e":"而想靠喝酒减肥是不可能的，除非你把自己喝到得胃病，大量减少进食，否则酒喝多了不但不会减肥，反而会发胖-因为酒本身就是粮食酿造的，每克酒精含有7大卡能量。"},{"q":"应酬饮酒的中量标准，每天不超过？","o":["500毫升红酒","1000毫升红酒","5两低度白酒","4瓶啤酒"],"a":0,"e":"这里的中量，是每天不超过500毫升红酒，或两瓶啤酒，或3两低度白酒。"},{"q":"吃火锅时建议的小料是？","o":["麻酱","酱油小米辣","油碟","沙拉酱"],"a":1,"e":"小料的选择上，我的建议是酱油小米辣，能吃辣的一定要多来点辣椒。"},{"q":"吃火锅搭配的主食建议是？","o":["麻酱烧饼","红糖糍粑","煮玉米或涮山药","炒饭"],"a":2,"e":"对于减肥人群来说，可以考虑煮个玉米、涮盘山药，喜欢的话，土豆、红薯也行。"},{"q":"情绪化进食的两点判定标准是？","o":["有负面情绪、停不下来","饿了想吃、吃饱就停","无聊加嘴馋","压力大加失眠"],"a":0,"e":"情绪化进食有两点判定标准：第一，有负面情绪；……第二，停不下来。"},{"q":"导致情绪化进食的风险因素包括？","o":["节食","规律运动","吃早餐","午睡"],"a":0,"e":"因此，节食被认为是导致情绪化进食的一个风险因素。"},{"q":"述情障碍是指？","o":["不会表达情绪","有情绪问题不愿表达、不会表达、不知道怎样正确表达","害怕社交","情绪波动大"],"a":1,"e":"简单来说，就是有了情绪问题，不愿表达，不会表达，不知道怎样正确表达。"},{"q":"进食前，判断饥饿级别的方法是？","o":["用1到10给饥饿感打分","看时间","问朋友","称体重"],"a":0,"e":"进食前，把注意力集中在胃部，用1到10给饥饿感打个分，判断一下自己的饥饿级别。"},{"q":"“三口进食法”的正确做法是？","o":["每餐只吃三口","先吃三口再重新评估饥饿感","三口饭一口菜","三口菜一口饭"],"a":1,"e":"人们对于特别想要品尝的食物，往往只在前三口能保持极大的热情，之后就会顺从身体惯性过度摄入。因此，你可以先吃三口，然后重新评估自己的饥饿感，及时在不想吃的时候停下来。"},{"q":"下列不属于“五问反思法”的是？","o":["与谁进餐","吃了些什么","何时进餐","花了多少钱"],"a":3,"e":"用餐结束后，你可以通过'五问反思法'来记录自己的饮食，回答'与谁进餐''吃了些什么''何时进餐''何处进餐''为什么要吃'这五个问题。【'五问'之中没有'花了多少钱'】"},{"q":"进食障碍属于哪类疾病？","o":["消化系统疾病","精神类疾病","代谢性疾病","传染性疾病"],"a":1,"e":"它虽然表现为饮食方面的问题，但其实已经属于精神类疾病。"},{"q":"生理性饥饿通常具有的特点是？","o":["突然出现","逐渐产生并且吃时会感到满足","只想吃特定食物","伴随负罪感"],"a":1,"e":"生理性的饥饿通常是逐渐产生的，并且饿的时候什么东西都想吃，吃的时候会感受到慢慢吃饱，也会感到很满足。"},{"q":"一项系统回顾发现，夜间工作使肥胖风险增加了？","o":["13%","23%","33%","43%"],"a":1,"e":"一项系统回顾在评估了28项研究之后，观察到夜间工作使肥胖的风险增加了23%，其中腹部肥胖的风险增加了35%。"},{"q":"夜间工作使腹部肥胖的风险增加了？","o":["25%","35%","45%","55%"],"a":1,"e":"一项系统回顾在评估了28项研究之后，观察到夜间工作使肥胖的风险增加了23%，其中腹部肥胖的风险增加了35%。"},{"q":"生活作息不规律不包括下列哪项？","o":["24点以后进食","入睡或睡醒时间经常相差4小时以上","睡眠时间少于6小时","每周运动少于3次"],"a":3,"e":"进食不规律（有24点以后进食的习惯）、睡眠不规律（今明两天的入睡时间或睡醒时间，经常相差4小时以上）、睡眠时间少于6个小时、夜间工作（长期工作到24点以后）、长时间夜间光照（24点到凌晨4点），打乱了我们身体最最重要的一个生理时钟——昼夜生物钟。【所列'作息不规律'表现中并没有'每周运动少于3次'】"},{"q":"禁食通常被定义为超过多少小时完全禁食含能量食物和饮料？","o":["6小时","8小时","12小时","24小时"],"a":2,"e":"禁食通常被定义为，在超过12个小时的时间内，完全禁食含能量的食物和饮料。"},{"q":"限时饮食（TRE）要求将每日能量摄入限制在多少小时内完成？","o":["2~6小时","4~12小时","12~16小时","16~20小时"],"a":1,"e":"限时饮食（TRE）是一种模拟禁食的形式，它要求将每日的能量摄入限制在4~12个小时内完成，这样就可以延长空腹状态的时间。"},{"q":"将进食窗口缩短到8小时内（如6~16点），可以达到什么效果？","o":["只避免增重","避免增重且有一定减重效果","完全没有效果","会导致增重"],"a":1,"e":"在这个基础上，如果我们把进食窗口缩短到8个小时内，并且尽量早一点，比如6~16点，就不仅可以避免增重，甚至还有减重的效果。"},{"q":"低碳水饮食方案适合在减肥早期的多长时间使用？","o":["1个月","3~6个月","1年","长期"],"a":1,"e":"我在前面已经介绍过，低碳水饮食方案虽然不适合长期使用，但在早期的3~6个月，还是有非常大的优势。"},{"q":"低碳水饮食要求碳水化合物减少到摄入总能量的？","o":["15%~25%","25%~40%","40%~55%","60%~70%"],"a":1,"e":"（1）将平时摄入的碳水化合物减少到摄入总能量的25%~40％。"},{"q":"低碳水饮食期间应避免的高碳水化合物蔬菜是？","o":["菠菜","红薯","生菜","黄瓜"],"a":1,"e":"蔬菜吃起来越粉糯，可吸收的碳水化合物含量就越高，比如红薯、南瓜、土豆、芋头、山药等，都是高碳水化合物蔬菜。"},{"q":"低碳水饮食期间应避免的甜味水果是？","o":["葡萄","柚子","草莓","牛油果"],"a":0,"e":"水果越甜，可吸收的碳水化合物越多，比如葡萄、苹果、荔枝等，因此要尽量避免。"},{"q":"下列哪种人群不适合低碳水饮食方案？","o":["糖尿病患者","高血脂或心血管疾病患者","肉食爱好者","超重人群"],"a":1,"e":"其次，高血脂或心血管疾病患者不能采用低碳水饮食方案，因为这会使血脂进一步紊乱。"},{"q":"低碳水饮食期间为什么要避免大量剧烈运动？","o":["会降低剧烈运动的耐受能力","会增加食欲","会升高血糖","会导致脱水"],"a":0,"e":"这是真的，因为低碳水饮食会降低剧烈运动的耐受能力。"},{"q":"低碳水饮食时建议“肥肉适当多一些”，其作用不包括？","o":["缓解便秘","提高代谢","促进燃脂","降低血脂"],"a":3,"e":"（4）肥肉适当多一些。这一方面可以缓解因低碳水饮食纤维素摄入减少造成的便秘，另一方面可以提高代谢，促进燃脂。【书中未提及'降低血脂'这一作用】"},{"q":"停不下主食的人在保证能量缺口的前提下，碳水可占到总能量的？","o":["30%左右","40%左右","60%甚至70%","80%以上"],"a":2,"e":"在能量缺口的基础上，热爱碳水化合物的你，可以让摄入的碳水化合物占到总能量的60％甚至70%，同时尽量减少脂肪，并保证最低限度的蛋白质。"},{"q":"改变碳水化合物质量时，应拒绝？","o":["糙米饭","油炸类主食","荞麦面","全麦面"],"a":1,"e":"第一，要拒绝油炸类的主食，如糍粑、油条、薯条、薯片等，因为这种食物碳水化合物高，脂肪也高，肚子还没填饱，能量就超标了。"},{"q":"下列属于低GI主食的是？","o":["大米","白面馒头","糙米和荞麦面","糍粑"],"a":2,"e":"第三，尽量选用低GI食材来制作主食。你可以把原来大米、白面做的主食都替换成糙米、荞麦面、全麦面，然后想吃就吃吧。"},{"q":"停不下主食的人，正确的吃饭顺序是？","o":["先吃主食","先吃肉和菜再吃饭","只吃主食","先喝饮料"],"a":1,"e":"先吃肉和菜，把肚子的饥饿感驱走一些，然后再吃饭。"},{"q":"晚上9、10点特别想吃主食，排除节食诱发的饥饿后，很可能是？","o":["焦虑","缺觉","低血糖","习惯"],"a":0,"e":"有一类特殊的主食爱好者会跟我描述：'晚上，尤其9、10点以后，本来都快睡觉了，突然特别特别想吃主食……'这种情况，如果排除了节食诱发的饥饿，很有可能是焦虑了。"},{"q":"正常亚洲女性的BMI范围是？","o":["16.5~21.9","18.5~24","20.5~25.9","22.5~27.9"],"a":1,"e":"正常亚洲女性的BMI应该在18.5和24之间，这就是我们判断一个人需不需要减肥的最重要指标。"},{"q":"女性BMI小于18.5时，正确做法是？","o":["继续严格减肥","增加一点脂肪和肌肉","加大运动量","服用减肥药"],"a":1,"e":"如果你的BMI小于18.5，我不会给你任何减肥的机会，再减就是拿生命开玩笑。相反，我会觉得你可能需要增加一点脂肪和肌肉。"},{"q":"女性BMI在18.5~22之间时，建议？","o":["继续减重","体重不要再减，可关注体脂率和体型","加大节食力度","减少脂肪"],"a":1,"e":"如果你的BMI在18.5和22之间，我的建议是，体重一定不要再减了，再减就会面临免疫力下降和衰老加速等问题。但你如果确实对身材不满意，可以看一下你的体脂率和体型，考虑如何增加肌肉替代脂肪，并把脂肪从肚子上转移到大腿上。"},{"q":"女性BMI在22~24之间时？","o":["必须减肥","不需要有减肥压力，真想减也可以见好就收","绝对不能减","只能增肌"],"a":1,"e":"如果你的BMI在22和24之间，你不需要有减肥的压力，但真想减一点也可以，一定要见好就收，可以重点看体脂率和体型。"},{"q":"女性减肥每天能量摄入不到多少大卡，很快会出现脱发、停经等问题？","o":["1000大卡","1200大卡","1500大卡","1800大卡"],"a":1,"e":"开始减肥之后，有一种情况在我的女性患者里非常常见，就是急于求成，或者要求极其严格，每天的能量摄入还不到1200大卡，有大量运动时也不到1500大卡，营养搭配极不均衡。"},{"q":"月经对于减肥来说有两个重要功能，分别是？","o":["检验和代谢重塑","排毒和补水","减重和增肌","检验和排毒"],"a":0,"e":"②月经是你检验自己减肥方法是否正确的坐标，同时也是你重塑代谢的开始"},{"q":"月经后的一周应该如何安排？","o":["静养休息","确保增加运动量","严格节食","只吃水果"],"a":1,"e":"第二，月经后的一周确保增加运动量。"},{"q":"月经期保证睡眠，可以降低哪些拖慢代谢的激素水平？","o":["糖皮质激素、胰岛素","雄激素","生长激素","肾上腺素"],"a":0,"e":"有研究显示，月经期饮食结构合理，睡眠充足，会大大降低接下来一个月拖慢代谢的激素的水平-这类激素包括糖皮质激素、胰岛素等。"},{"q":"围绝经期是指？","o":["月经开始前的时期","女性绝经前后的一段时期","产后恢复期","青春期"],"a":1,"e":"围绝经期是指女性绝经前后的一段时期，到了这个时期，肥胖及心脑血管疾病风险都在成倍地增加，减肥变得更加重要。"},{"q":"判断孩子是否肥胖，需要把BMI和什么对比？","o":["全国平均水平","相同性别的同龄孩子","成年人标准","父母BMI"],"a":1,"e":"世界卫生组织也是通过计算BMI来判断孩子体重是否正常的，不过稍微复杂一点，算出来的BMI需要和相同性别的同龄孩子进行对比。"},{"q":"儿童BMI超过哪个百分位线属于超重？","o":["75th","85th","90th","97th"],"a":1,"e":"图3.3～图3.6就是不同年龄段男孩女孩的标准BMI范围，你可以先算一下孩子的BMI，然后再跟图表对照-85th和15th中间部分属于正常体重，超过85th那根线就是超重，超过97th那根线就是肥胖。"},{"q":"儿童BMI超过哪个百分位线属于肥胖？","o":["85th","90th","95th","97th"],"a":3,"e":"图3.3～图3.6就是不同年龄段男孩女孩的标准BMI范围，你可以先算一下孩子的BMI，然后再跟图表对照-85th和15th中间部分属于正常体重，超过85th那根线就是超重，超过97th那根线就是肥胖。"},{"q":"肥胖儿童在成年后继续肥胖的概率是？","o":["20%~30%","42%~63%","70%~80%","90%以上"],"a":1,"e":"调查显示，肥胖的儿童在成年后，有42%~63％的概率会继续肥胖；"},{"q":"肥胖青少年在成年后继续肥胖的概率高达？","o":["42%~63%","50%~60%","70%~80%","85%以上"],"a":2,"e":"肥胖的青少年在成年后，继续肥胖的概率更是高达70%~80％。"},{"q":"脂肪细胞的生长发育期是？","o":["出生前","成年之前","成年之后","青春期之后"],"a":1,"e":"在我们漫长的一生中，脂肪细胞的生长发育期只有一个，就是成年之前。"},{"q":"成年后脂肪细胞的特点是？","o":["数量会继续增多","数量固定，变化的是大小","数量会减少","大小固定不变"],"a":1,"e":"不管你是胖了还是瘦了，变化的都不是脂肪细胞的数量，而是它们的大小。"},{"q":"孩子肥胖导致“不长个儿”的原因是？","o":["营养不良","骨骺线提前闭合","运动太少","睡眠不足"],"a":1,"e":"脂肪细胞的过度增加会引发内分泌失调，从而导致孩子过早发育，骨骺线提前闭合。"},{"q":"父母双方都胖的孩子，肥胖风险是父母体重正常孩子的？","o":["2倍","2.7倍","3.1倍","4倍"],"a":3,"e":"研究显示，父母双方都胖的，孩子肥胖的风险是父母双方体重都正常的孩子的4倍；"},{"q":"新生儿出生时的正常体重范围是？","o":["2.5~4千克","3~5千克","2~3千克","4~6千克"],"a":0,"e":"新生儿出生时的体重，正常范围是2.5~4千克。"},{"q":"世界卫生组织建议母乳喂养至少到孩子多大？","o":["6个月","1周岁","2周岁","3个月"],"a":1,"e":"第四招，母乳喂养，至少到孩子1周岁。"},{"q":"1~3岁孩子每天最多喝多少果汁？","o":["120毫升","180毫升","240毫升","300毫升"],"a":0,"e":"根据美国儿科学会的推荐，1~3岁的孩子每天最多喝120毫升果汁；"},{"q":"限制孩子玩电子产品每天不超过多少小时？","o":["0.5小时","1小时","2小时","3小时"],"a":1,"e":"第九招，限制孩子玩电子产品，每天不超过1个小时。"},{"q":"适度寒冷可以促进哪种细胞的增长？","o":["白色脂肪","棕色脂肪","肌肉","骨骼"],"a":1,"e":"而适度的寒冷，会促进棕色脂肪细胞的增长。"},{"q":"日本学者推荐亚洲人将孕前BMI控制在多少以内？","o":["21","23","25","24"],"a":1,"e":"一些日本学者认为，新生儿体重在很大程度上取决于妈妈的孕前BMI，并推荐亚洲人将孕前BMI控制在23以内。"},{"q":"孕前BMI正常的孕妇（18.5~23.9），孕期总增重范围是？","o":["12.5~18千克","11.5~16千克","7~11.5千克","5~9千克"],"a":1,"e":"书中表3-1（美国国家科学院对孕期女性体重增长值的推荐）给出：孕前体重正常的孕妇（BMI 18.5~23.9），孕期总增重建议为11.5~16千克。"},{"q":"孕前体重过低（BMI小于18.5）的孕妇，孕期总增重范围是？","o":["12.5~18千克","11.5~16千克","7~11.5千克","5~9千克"],"a":0,"e":"书中表3-1（美国国家科学院对孕期女性体重增长值的推荐）给出：孕前体重过低的孕妇（BMI小于18.5），孕期总增重建议为12.5~18千克。"},{"q":"孕期推荐的骑车锻炼频率是？","o":["每周2次以上、每次20分钟","每周3次以上、每次30分钟以上","每周1次、每次1小时","每天1次"],"a":1,"e":"研究表明，每周3次以上、每次30分钟以上的骑车锻炼，有助于降低孕妇妊娠期体重过度增加的风险和妊娠糖尿病发病率。"},{"q":"产后体重恢复的建议不包括？","o":["母乳喂养","保持良好情绪","维持正常睡眠","严格节食"],"a":3,"e":"关于产后的体重恢复，我的建议是：（1）母乳喂养；（2）保持良好的情绪；（3）维持正常的睡眠时间。②母乳喂养、情绪良好、睡眠充足，是产后体重恢复最简单有效的方法。【三条建议中并没有'严格节食'】"},{"q":"女性产后6个月每天睡眠不超过多少小时，与一年后体重增加密切相关？","o":["5小时","6小时","7小时","8小时"],"a":0,"e":"这一方面不利于妈妈体重的恢复-数据表明，女性产后6个月每天睡眠时间不超过5个小时，与一年后的体重增加密切相关；"},{"q":"我们日常耗能中，基础代谢大约占？","o":["50%","60%","70%","80%"],"a":2,"e":"在我们日常的耗能中，基础代谢占70％左右，日常活动的耗能大约占20%，而只要你不是长时间高强度运动，一般的运动耗能只占1%~5％。"},{"q":"日常活动的耗能大约占？","o":["10%","20%","30%","40%"],"a":1,"e":"在我们日常的耗能中，基础代谢占70％左右，日常活动的耗能大约占20%，而只要你不是长时间高强度运动，一般的运动耗能只占1%~5％。"},{"q":"一般运动的耗能只占？","o":["1%~5%","10%~15%","20%~25%","30%左右"],"a":0,"e":"在我们日常的耗能中，基础代谢占70％左右，日常活动的耗能大约占20%，而只要你不是长时间高强度运动，一般的运动耗能只占1%~5％。"},{"q":"下列日常活动中，能量消耗最大的是？","o":["散步","爬楼梯","做家务","遛狗"],"a":1,"e":"在各种日常活动中，爬楼梯是能量消耗最大的一种。"},{"q":"普通家务和娱乐性活动，每天可以额外消耗多少能量？","o":["50~100大卡","100~200大卡","200~300大卡","300~400大卡"],"a":1,"e":"做饭、洗碗、买菜、洗车、照顾小孩、扫地、拖地、搬重物，等等，都是我们日常生活中常干的家务。别小看了这些活动，数据显示，普通家务和娱乐性活动，每天可以额外消耗100~200大卡的能量，大约相当于半个小时中等强度的运动量。"},{"q":"每天跳绳10分钟，可以燃烧将近多少大卡？","o":["100大卡","200大卡","300大卡","400大卡"],"a":1,"e":"如果每天跳10分钟，能够燃烧将近200大卡的能量。"},{"q":"适合在办公室或家里进行的运动需满足的两个条件是？","o":["空间小、强度大","时间长、强度小","空间大、强度大","时间短、强度小"],"a":0,"e":"适合在办公室或家里进行的运动，需要满足两个条件，一是占用的空间小，二是运动强度大。"},{"q":"高血压患者体重每减少1千克，相当于血压下降多少？","o":["0.5毫米汞柱","1毫米汞柱","2毫米汞柱","5毫米汞柱"],"a":1,"e":"美国最新的高血压指南指出，体重减少1千克，相当于收缩压或舒张压下降1毫米汞柱，这个效果可以一直累加到5千克，也就是血压下降5毫米汞柱。"},{"q":"仅靠减肥减重5千克，可获得的降压效果接近？","o":["半片降压药","一片降压药","两片降压药","不需要吃药"],"a":0,"e":"这意味着，仅靠减肥，你就可以获得半片降压药的效果。"},{"q":"高血压患者减肥推荐采用的饮食方案是？","o":["低碳水饮食","地中海饮食","低脂肪饮食","高蛋白饮食"],"a":1,"e":"如果你患有高血压，我推荐你在减肥时采用我们前面讲过的地中海饮食方案，结合每周不少于150分钟的持续中等强度有氧运动。"},{"q":"高血压患者的运动建议是每周不少于多少分钟的中等强度有氧运动？","o":["90分钟","120分钟","150分钟","200分钟"],"a":2,"e":"如果你患有高血压，我推荐你在减肥时采用我们前面讲过的地中海饮食方案，结合每周不少于150分钟的持续中等强度有氧运动。"},{"q":"高血脂人群想要降血脂，碳水化合物应占摄入总能量的？","o":["25%~40%","45%~55%","60%~70%","20%~30%"],"a":1,"e":"想要降低血脂，必须遵循我们前面讲过的营养均衡法则，就是让碳水化合物占摄入总能量的比例维持在45%~55%，其中要有0.5千克的蔬菜；"},{"q":"高血脂人群的脂肪摄入中，天然不饱和脂肪酸应占脂肪总量的多少以上？","o":["三分之一","一半","四分之三","全部"],"a":1,"e":"此外，脂肪一定要吃够，并且天然的不饱和脂肪酸要占到脂肪总量一半以上。"},{"q":"高血糖人群减肥推荐采用？","o":["低碳水饮食方案","高碳水饮食","低脂肪饮食","地中海饮食"],"a":0,"e":"关于高血糖人群的减肥，我郑重推荐低碳水饮食方案，具体怎么做，可以参考本章“如果你是个肉食动物”一节。"},{"q":"甲状腺功能减退的典型表现不包括？","o":["皮肤干燥","手脚怕冷","精力旺盛","月经量少"],"a":2,"e":"我仔细询问了她的三餐情况……我再三追问，发现她皮肤特别爱干燥，手脚很怕冷，经常犯困，打不起精神，月经只有两天，量也很少。我告诉她，你需要仔细检查一下甲状腺功能，我怀疑你有甲减。【甲减的典型表现是怕冷、犯困、乏力等，并非'精力旺盛'】"},{"q":"发现甲状腺功能减退后，首先要做的是？","o":["严格节食","补充甲状腺素","大量运动","服用减肥药"],"a":1,"e":"如果发现甲状腺功能减退，首先要做的是补充甲状腺素。"},{"q":"甲状腺功能减退患者为什么要特别强调减盐？","o":["因为身体储水增加","因为盐会增加脂肪","因为盐影响睡眠","因为会口渴"],"a":0,"e":"其次，因为甲状腺功能减退会使身体储水增加，脂代谢紊乱，所以对于甲状腺功能减退患者，要特别强调减盐，避免水肿加重，并且在减肥过程中也不推荐使用低碳水高脂肪饮食方案，避免脂代谢进一步紊乱。"},{"q":"甲状腺功能减退患者减肥时不推荐？","o":["均衡饮食","低碳水高脂肪饮食","地中海饮食","高蛋白饮食"],"a":1,"e":"其次，因为甲状腺功能减退会使身体储水增加，脂代谢紊乱，所以对于甲状腺功能减退患者，要特别强调减盐，避免水肿加重，并且在减肥过程中也不推荐使用低碳水高脂肪饮食方案，避免脂代谢进一步紊乱。"},{"q":"甲状腺功能自检超过多少分，建议去医院检查？","o":["4分","5分","7分","10分"],"a":2,"e":"如果自检超过7分，建议你赶紧去医院检查。"},{"q":"下列富含硒的食物是？","o":["坚果","米饭","面条","馒头"],"a":0,"e":"天然食物，比如坚果、金枪鱼、沙丁鱼、蛋黄以及牛肉等都有比较丰富的硒。"},{"q":"富含锌的食物不包括？","o":["牡蛎","贝壳类","坚果种子","苹果"],"a":3,"e":"天然食物中含锌比较多的是牡蛎、贝壳类、坚果种子以及牛肉等。【'苹果'不在含锌丰富的食物之列】"},{"q":"阻塞性睡眠呼吸暂停通俗地说就是？","o":["失眠多梦","打呼噜特别严重导致气道阻塞","嗜睡","睡眠不足"],"a":1,"e":"阻塞性睡眠呼吸暂停，说通俗一点，就是打呼噜打得特别严重，导致呼吸用的气道发生了阻塞，进气和出气都不顺畅。"},{"q":"中国罹患阻塞性睡眠呼吸暂停的成年人比例是？","o":["13.6%","23.6%","33.6%","43.6%"],"a":1,"e":"一是因为这个病发病率很高，在中国有23.6％的成年人罹患；"},{"q":"睡眠呼吸暂停自评达到多少分需要去医院？","o":["1分","2分","3分","5分"],"a":2,"e":"如果自评达到3分，那你就要去医院了，找呼吸科、心内科或者睡眠科的医生都行。"},{"q":"确诊睡眠呼吸暂停后的治疗方法不包括？","o":["应用呼吸机","采取侧卧位","减肥","大量饮用咖啡"],"a":3,"e":"确诊之后，你需要根据医生的指导，采取相应的方法，比如应用呼吸机、采取侧卧位、减肥等，改善夜间缺氧的问题。【治疗方法中并没有'大量饮用咖啡'】"},{"q":"减肥平台期是指连续多长时间体重不下降甚至反弹？","o":["3天以上","1周以上","两周以上","1个月以上"],"a":2,"e":"减肥过程中，连续两周以上体重不下降甚至有反弹趋势的阶段，被一些医学家定义为减肥平台期。"},{"q":"平台期出现的原因不包括？","o":["基础代谢降低","身体启动机制维持代谢平衡","方法做错了","生理平衡"],"a":2,"e":"它的出现不是因为我们做错了什么，而是身体开启了保护自己的机制。"},{"q":"度过平台期的三件事不包括？","o":["有点耐心","交替使用不同方法","增加肌肉","加大节食力度"],"a":3,"e":"如果到了平台期，请你做好三件事：有点耐心，方法轮替，以及增加肌肉，让自己的心理和身体做好准备迎接下一轮的减肥。【度过平台期并不靠'加大节食力度'】"},{"q":"平台期增加肌肉的建议是？","o":["减少力量训练","比平常增加一倍力量训练并补充蛋白质","停止运动","只做高强度有氧"],"a":1,"e":"这时候，建议你比平常增加一倍力量训练，同时补充蛋白质。"},{"q":"关于平台期的说法正确的是？","o":["只有不努力的人才会遇到","几乎人人都会经历","说明方法完全错了","应该立即换极端方法"],"a":1,"e":"好消息是它加强了我们减肥的耐心和决心，因为你会发现，只要减肥，几乎人人都得经历平台期。"},{"q":"关于快速减肥的真相是？","o":["辟谷可以健康减脂","除了动手术，几乎所有的快速减肥都不可信","生酮能永久减脂","减肥茶能刮油"],"a":1,"e":"真相：除了动手术，几乎所有的快速减肥都是不可信的。"},{"q":"快速减肥方法的本质是？","o":["减少脂肪","让你脱水","提高基础代谢","抑制食欲"],"a":1,"e":"其实，以上快速减肥方法的本质都是一样的：让你脱水。"},{"q":"水分占人体身体成分的多少？","o":["50%","60%","70%","80%"],"a":2,"e":"无论你是胖还是瘦，水分都占了你身体成分的70％。"},{"q":"减肥茶号称可以刮油，其实是添加了什么？","o":["维生素","医用泻药和利尿剂","蛋白质","膳食纤维"],"a":1,"e":"减肥茶号称可以刮油，其实是添加了医用泻药和利尿剂等，让饮用者增加排泄。"},{"q":"辟谷和生酮减肥法的共同点是？","o":["增加肌肉","消耗肌糖原及其储存的水分","提高基础代谢","增加脂肪"],"a":1,"e":"辟谷和生酮减肥法的共同点，是由于身体没了碳水化合物作为能量来源，正好消耗所有的肌糖原以及它储存的水分，从而达到脱水的效果。"},{"q":"世界卫生组织推荐的健康减肥速度是每周减少？","o":["0.5~1千克","1~2千克","2~3千克","3千克以上"],"a":0,"e":"世界卫生组织、大多数学者和权威机构推荐的健康减肥速度，都是每周减少0.5~1千克，超过1.5千克的话，减肥者患胆结石的风险会大幅提高（见图4-1）。"},{"q":"每周减重超过多少千克，患胆结石的风险会大幅提高？","o":["1千克","1.5千克","2千克","2.5千克"],"a":1,"e":"世界卫生组织、大多数学者和权威机构推荐的健康减肥速度，都是每周减少0.5~1千克，超过1.5千克的话，减肥者患胆结石的风险会大幅提高（见图4-1）。"},{"q":"体重变化最大的20%人群与最小的20%相比，冠心病风险提高了？","o":["34%","64%","84%","104%"],"a":1,"e":"在受访人群中，其他危险因素完全一致的情况下，体重变化最大的20％患者与变化最小的20％相比，冠心病风险提高了64%，心肌梗死风险提高了117%，而脑卒中风险提高了136％。"},{"q":"别人试过有用的减肥方法，对你？","o":["一定有效","可能大多数都不一定有效","绝对无效","效果完全相同"],"a":1,"e":"答案是，可能大多数都不一定有效。"},{"q":"人与人之间减肥效果差异的原因不包括？","o":["基因差异","血糖效应差异","星座差异","生活习惯差异"],"a":2,"e":"这是因为，减肥的时候，人与人之间的差异实在太大了。第一，基因差异。……第二，血糖效应差异。……第三，体脂率差异。……第四，生活习惯差异。……第五，减肥史差异。【'星座差异'不在此列】"},{"q":"同样的食物在不同个体身上引起血糖效应不同的可能原因是？","o":["肠道微生物构成不同","年龄不同","性别不同","身高不同"],"a":0,"e":"同样的食物，在不同个体身上引起的血糖效应不一样，原因可能是肠道微生物构成的不同。"},{"q":"体脂率较高的人更适合？","o":["力量训练为主","有氧运动","节食","无氧训练为主"],"a":1,"e":"体脂率较高的人更适合有氧运动，减肥期摄入的能量相对应该更少一些。"},{"q":"宣称“0蔗糖”的产品，实际上？","o":["等于0糖","基本都不是0糖","等于0碳水化合物","等于0卡路里"],"a":1,"e":"说自己“0蔗糖”的产品，基本都不是0糖。"},{"q":"麦芽糖的GI比蔗糖？","o":["更低","更高","相同","无法比较"],"a":1,"e":"糖的种类很多，不加蔗糖，还可以添加其他糖，比如麦芽糖、白砂糖、果糖、葡萄糖、果葡糖浆、椰子糖等。麦芽糖的GI比蔗糖还要高，很多医学研究也都发现，果葡糖浆、人工添加的果糖，都会明显增加体重。"},{"q":"宣称“0糖”的食品？","o":["等于完全不含糖","顶多是没有额外添加糖，不等于不含糖或碳水","等于不含碳水化合物","能量一定很低"],"a":1,"e":"如果写的是'0糖'，顶多就是没有额外添加糖，不等于这种食品本身不含糖，或者不含碳水化合物。"},{"q":"无糖酸奶中含有？","o":["乳糖","蔗糖","麦芽糖","果葡糖浆"],"a":0,"e":"比如无糖酸奶，奶制品里本身有乳糖，也有碳水化合物；无糖饼干，虽然没有添加糖，但都是碳水化合物。"},{"q":"宣称“0脂肪”的产品往往？","o":["碳水化合物含量极低","碳水化合物含量很高","能量很低","蛋白质很高"],"a":1,"e":"如果某种食品宣称自己0脂肪，那你就得注意看看食品标签上碳水化合物的量，往往它的碳水化合物含量会极高。"},{"q":"代糖和甜味剂虽然没有能量，却会？","o":["直接升高血糖","干扰大脑内能量代谢的传递过程","增加饱腹感","促进排便"],"a":1,"e":"代糖和甜味剂虽然没有能量，却会干扰我们大脑内能量代谢的传递过程。"},{"q":"关于含代糖食物，最近的研究显示？","o":["对减肥和预防糖尿病有显著作用","在减肥和预防糖尿病上没有任何作用且糖尿病风险更高","可以放心多吃","比直接吃糖健康得多"],"a":1,"e":"所以，食物中添加代糖和甜味剂虽然比直接添加糖好一些，但是最近的研究显示，这在减肥和预防糖尿病上没有任何作用，而且比起不添加，糖尿病风险更高。"},{"q":"关于大量运动的真相是？","o":["能带来大幅度减重","并不能带来大幅度减重","是减肥最快的方法","最健康的方法"],"a":1,"e":"真相：大量运动并不能带来大幅度减重。"},{"q":"身体活动消耗的能量占人体总消耗的？","o":["5%~10%","15%~30%","40%~50%","60%~70%"],"a":1,"e":"身体活动消耗的能量，占人体能量总消耗的15%~30%，但这并不意味着大量剧烈运动就能达到消耗值的上限。"},{"q":"BMI较高的人，运动后的能量补偿比例会达到？","o":["19%","29%","39%","49%"],"a":3,"e":"尤其是BMI较高的人，能量补偿比例会达到49%，也就是说，运动消耗的能量可能会被打对折，辛辛苦苦做运动消耗的能量，又被身体的节能本能给补充回来了。"},{"q":"如果要进行大量剧烈运动，应避开？","o":["周末","重度疲劳期和高压期","早晨","饭后"],"a":1,"e":"所以，如果要进行大量剧烈运动，请一定避开自己的重度疲劳期和高压期。"},{"q":"运动效果递减的原因是？","o":["动作熟练化、运动模式固定化、体重下降","肌肉增多","代谢提高","食欲变好"],"a":0,"e":"这是因为，动作的熟练化、运动模式的固定化，加上体重下降，造成相同运动强度下，单位时间身体消耗的能量在不断下降。"},{"q":"目前最管用的脂肪吸收抑制剂奥利司他，吸收抑制作用只有？","o":["10%","20%","30%","50%"],"a":2,"e":"目前最管用的脂肪吸收抑制剂，奥利司他，也只有30％的吸收抑制作用。"},{"q":"全球目前的研究中，抑制脂肪吸收可以稳定达到多少的食品提取物？","o":["30%","10%","连5%都没有","50%"],"a":2,"e":"事实上，不要说30%，全球目前的研究中，可以稳定达到5％的都没有，连安慰剂的效果都不如。"},{"q":"左旋肉碱、咖啡因、辣椒素在燃脂中的角色是？","o":["直接燃烧脂肪","把脂肪运送到线粒体的搬运工","抑制食欲","提高体温"],"a":1,"e":"有些产品添加了左旋肉碱啊，咖啡因啊，辣椒素啊，医学上有一定证据证明它们可以加速脂肪燃烧。这一功能的核心原理是，它们可以协助身体把脂肪运送到其燃烧场所——线粒体，相当于搬运工。"},{"q":"由专业减肥机构指导的减肥，成功率比普通减肥大约高？","o":["5%~10%","10%~50%","50%~80%","80%以上"],"a":1,"e":"美国有研究指出，由专业减肥机构指导的减肥，成功率大约比普通减肥高10%~50％。"},{"q":"需要警惕的减肥训练营关键词是？","o":["训练营","只管三个月","饮食管理","运动管理"],"a":1,"e":"04.6 只管三个月的减肥训练营"},{"q":"判断训练营方法能否长期应用的最重要标准是？","o":["有没有节食、饥饿感重不重","训练强度大不大","价格贵不贵","环境好不好"],"a":0,"e":"最重要的判断标准就是有没有节食，饥饿感是不是特别重。"},{"q":"好的减肥方案，随着体重越来越轻，应该？","o":["人越来越没精神","精力越来越充沛","需要加大节食","开始掉头发"],"a":1,"e":"好的减肥方案，随着体重越来越轻，精力应该越来越充沛，而不是体重越下降，人越没精打采。"},{"q":"《中国超重/肥胖医学营养治疗专家共识》指出，配合营养代餐的强化生活方式干预？","o":["比单纯的膳食支持和教育更有效","没有作用","有害健康","与普通饮食相同"],"a":0,"e":"《中国超重／肥胖医学营养治疗专家共识》明确指出，总的来说，配合营养代餐的强化生活方式干预，比单纯的膳食支持和教育，更能有效降低患者的体重。"},{"q":"代餐是不是智商税？","o":["是","不是，可以有效帮人省脑省时间","全部都是","看价格"],"a":1,"e":"代餐的出现有效地解决了这个问题，可以帮助人们省脑省时间。"},{"q":"中国营养学会代餐团体标准中，每餐代餐的能量应为？","o":["100~200千卡","200~400千卡","400~600千卡","600千卡以上"],"a":1,"e":"能量：每餐代餐食品所提供的能量应为200~400千卡。"},{"q":"代餐中蛋白质提供的能量应占总能量的？","o":["10%~20%","25%~50%","50%~70%","70%以上"],"a":1,"e":"蛋白质：代餐中蛋白质提供的能量应占总能量的25%~50％。"},{"q":"代餐中脂肪提供的能量不应超过总能量的？","o":["20%","30%","40%","50%"],"a":1,"e":"脂肪：代餐中脂肪提供的能量不应超过总能量的30%，来源于饱和脂肪酸的能量不应超过总能量的10%，不得使用氢化油脂，亚油酸供能比不应低于3％。"},{"q":"代餐标准中，不得使用？","o":["氢化油脂","植物油","橄榄油","菜籽油"],"a":0,"e":"脂肪：代餐中脂肪提供的能量不应超过总能量的30%，来源于饱和脂肪酸的能量不应超过总能量的10%，不得使用氢化油脂，亚油酸供能比不应低于3％。"},{"q":"下列哪项不是代餐的“坑”？","o":["正规营养代餐按标准食用","燕麦酸奶冒充代餐","能量棒蛋白质几乎没有全是脂肪碳水","每餐只有120大卡变相节食"],"a":0,"e":"代餐的确不是智商税。……代餐的出现有效地解决了这个问题，可以帮助人们省脑省时间。但随着代餐市场的迅速火爆，各种品牌、形式的代餐产品让人目不暇接，不知该如何选择。如果选错了，那就真是交了智商税。"}],"multis":[{"q":"减肥失败者重新出发的“三步法”包括？","o":["找原因","定目标","考虑新工具","加大运动量"],"a":[0,1,2],"e":"如果曾经减肥失败过，在开启新一轮减肥时，你就不能简单照搬前几章讲的方法了，我有非常实用的'三步法'给到你。……总结一下：找到自己减肥失败的原因，定个小目标，选择好新工具，你就可以再次出发了。"},{"q":"6个月减重10%左右的目标设置有三个好处，包括？","o":["难度适中、努努力就能达到","健康、降低糖尿病等疾病风险","不容易反弹","短期见效最快"],"a":[0,1,2],"e":"这么设定有三个好处：第一，难度适中，努努力就能达到；第二，健康，即使6个月后你还没达到'三体目标'，减少了10%左右的体重，也已经大大降低了糖尿病、心血管疾病、不孕不育等风险；第三，不容易反弹，很多人之所以复胖，问题都出在近期目标的设定上，'欲速则不达'，稳一点，慢慢来，才是减肥成功的保证。"},{"q":"减肥失败后可以借助的新工具包括？","o":["心理评估和心理治疗","饮食日记、餐盘、代餐和轻断食","HIIT、力量训练","抽脂手术"],"a":[0,1,2],"e":"在这里，心理评估和心理治疗，就是我们在心理因素层面借助的新工具。……饮食层面，我们可以借助日记、餐盘，以及超好用的代餐和轻断食。运动层面，我们有HIIT、力量训练，等等。"},{"q":"可以贴上绿色标签的零食包括？","o":["不加盐和糖的烘烤坚果","不调味的鲜牛奶和酸奶","完整水果或不加调味品的水果干","果汁"],"a":[0,1,2],"e":"什么样的零食可以贴上绿色标签呢？主要包括三类，一类是烘烤坚果，不加盐和糖；一类是奶制品，鲜牛奶、酸奶，不调味；还有一类是完整的水果，或者不加调味品的水果干。"},{"q":"需要贴红色标签的零食包括？","o":["每100克能量超过2000千焦的食物","精制碳水化合物占40%以上且脂肪含量不低的食物","所有含糖饮料","无糖苏打水"],"a":[0,1,2],"e":"所以，每100克能量超过2000千焦（477.8大卡）的食物，精制碳水化合物占到40％以上且脂肪含量也不低的食物，以及所有的含糖饮料，都需要贴上红色标签。"},{"q":"属于黄色标签的零食包括？","o":["杂粮饼干","麻辣鸭脖","调味酸奶","不加盐糖的烘烤坚果"],"a":[0,1,2],"e":"没绿色那么健康，也不像红色那么不健康的零食，则可以贴上黄色标签，比如杂粮饼干、麻辣鸭脖、调味酸奶、果汁，等等。"},{"q":"吃火锅时应尽量不选的食材包括？","o":["蟹棒","鱼豆腐","鲜豆腐","虾滑"],"a":[0,1,3],"e":"蟹棒、鱼豆腐、丸子、虾滑、午餐肉、香肠之类，就尽量不要选了；"},{"q":"吃火锅时豆制品应选择？","o":["鲜豆腐","冻豆腐","油豆皮","炸豆泡"],"a":[0,1],"e":"豆制品选鲜豆腐、冻豆腐，不要油豆皮、炸豆泡和腐竹之类。"},{"q":"应酬饮酒的“中量”标准包括？","o":["每天不超过500毫升红酒","两瓶啤酒","3两低度白酒","半斤高度白酒"],"a":[0,1,2],"e":"这里的中量，是每天不超过500毫升红酒，或两瓶啤酒，或3两低度白酒。"},{"q":"述情障碍的化解出口包括？","o":["找到倾诉对象","培养爱好","学会控制进食时的情绪","暴饮暴食"],"a":[0,1,2],"e":"想解决述情障碍，我们就要设法在刚刚产生负面情绪的时候把它化解开，给自己的情绪找一个出口。这个出口有外向的，有内在的。……外向的比较容易上手，就是找到倾诉的对象，煲个电话粥，聊个八卦，或者找个爱好，运动啊，画画啊，唱歌啊，旅游啊，等等。……内在的化解比较高阶……这个方法，就是学会控制进食时的情绪。"},{"q":"“五问反思法”包括哪些问题？","o":["与谁进餐","吃了些什么","何时进餐","何处进餐","为什么要吃"],"a":[0,1,2,3,4],"e":"用餐结束后，你可以通过“五问反思法”来记录自己的饮食，回答“与谁进餐”“吃了些什么”“何时进餐”“何处进餐”“为什么要吃”这五个问题，并把它们记录下来。"},{"q":"情绪化进食的特点包括？","o":["突然出现","只想吃特定食物","感受不到逐渐吃饱","伴随负罪感或羞耻感"],"a":[0,1,2,3],"e":"而情绪化进食则通常是突然出现的，并且可能只是想吃某种特定的食物，比如薯片，吃的时候可能感受不到逐渐吃饱，更可能是一直狂吃，直到有些不舒服才停下来，通常还可能伴随着一些负罪感或羞耻感。"},{"q":"生活作息不规律的表现包括？","o":["进食不规律（24点以后进食）","睡眠不规律（入睡或睡醒时间相差4小时以上）","睡眠时间少于6小时","夜间工作"],"a":[0,1,2,3],"e":"进食不规律（有24点以后进食的习惯）、睡眠不规律（今明两天的入睡时间或睡醒时间，经常相差4小时以上）、睡眠时间少于6个小时、夜间工作（长期工作到24点以后）、长时间夜间光照（24点到凌晨4点），打乱了我们身体最最重要的一个生理时钟-昼夜生物钟。"},{"q":"作息无法规律时，外加“进食-禁食”节律的好处包括？","o":["支持代谢平衡","保护代谢激素","避免增重","可以完全不用睡觉"],"a":[0,1,2],"e":"当我们的昼夜节律乱了，人体就会缺乏内在的行为节律，在这种情况下，可以求助于外加的进食-禁食节律来支持代谢的平衡。也就是说，我们可以主动建立起进食的合理节奏，反过来保护好用来代谢的激素，也就避免了作息不规律导致的增重问题。"},{"q":"低碳水饮食期间需要避开的碳水化合物包括？","o":["油炸碳水化合物主食","红薯、南瓜、土豆等粉糯蔬菜","甜味水果","含糖饮料"],"a":[0,1,2,3],"e":"①油炸碳水化合物主食。……②富含碳水化合物的蔬菜。蔬菜吃起来越粉糯，可吸收的碳水化合物含量就越高，比如红薯、南瓜、土豆、芋头、山药等，都是高碳水化合物蔬菜。③甜味水果。水果越甜，可吸收的碳水化合物越多，比如葡萄、苹果、荔枝等，因此要尽量避免。④各种含糖饮料。"},{"q":"低碳水饮食的注意事项包括？","o":["避免大量剧烈运动","高血脂或心血管疾病患者不能采用","糖尿病人很适合","可以长期使用"],"a":[0,1,2],"e":"配合低碳水饮食，还有几点注意事项：首先，要避免大量剧烈运动。……因为低碳水饮食会降低剧烈运动的耐受能力。其次，高血脂或心血管疾病患者不能采用低碳水饮食方案，因为这会使血脂进一步紊乱。糖尿病人则很适合。"},{"q":"停不下主食的正确应对包括？","o":["保证能量缺口前提下尽可能保留主食","选择低GI食物","一口肉、一口菜、一口饭","彻底戒掉主食"],"a":[0,1,2],"e":"①如果你停不下主食，那就在保证能量缺口的前提下，尽可能保留主食。②选择低GI食物尤为重要。③吃饭时一口肉、一口菜、一口饭。"},{"q":"需要拒绝或警惕的主食包括？","o":["糍粑","油条","薯条薯片","糙米饭"],"a":[0,1,2],"e":"第一，要拒绝油炸类的主食，如糍粑、油条、薯条、薯片等，因为这种食物碳水化合物高，脂肪也高，肚子还没填饱，能量就超标了。"},{"q":"女性减肥的关键时期包括？","o":["青少年时期","孕产期","月经期","围绝经期"],"a":[0,1,2,3],"e":"女性减肥有几个关键时期：青少年时期、孕产期、月经期和围绝经期。"},{"q":"女性BMI在22~24之间时的正确做法包括？","o":["不需要有减肥压力","真想减也可以但要见好就收","重点看体脂率和体型","必须立即减肥"],"a":[0,1,2],"e":"如果你的BMI在22和24之间，你不需要有减肥的压力，但真想减一点也可以，一定要见好就收，可以重点看体脂率和体型。"},{"q":"女性减肥不当可能导致的后果包括？","o":["免疫力下滑","衰老加速","月经停止","骨质疏松"],"a":[0,1,2,3],"e":"女性的储备本来就少，一旦减得不对，要么免疫力下滑，经常感冒，各种慢性疼痛找上身来，莫名其妙就觉得疲乏无力；要么衰老成倍加速，出现皮肤松弛、骨质疏松，甚至月经停止等一系列问题。"},{"q":"娃太胖的三个深远影响包括？","o":["不长个儿","一胖一辈子","危害心理健康","更容易感冒"],"a":[0,1,2],"e":"不好看、行动不灵活这些就不说了，我来说三个深远的影响。第一，不长个儿。……第二，一胖一辈子。……第三，也是最隐蔽的影响，危害孩子的心理健康。"},{"q":"关于脂肪细胞的正确说法包括？","o":["生长发育期只有成年之前","青春期数量达到顶峰","成年后数量固定、变化的是大小","脂肪细胞有“记忆”"],"a":[0,1,2,3],"e":"在我们漫长的一生中，脂肪细胞的生长发育期只有一个，就是成年之前。婴幼儿时期，脂肪细胞就开始大量繁殖；到青春期的时候，数量达到顶峰。从此以后，这个数量就不会再变了。……不管你是胖了还是瘦了，变化的都不是脂肪细胞的数量，而是它们的大小。……此外，脂肪细胞居然还有'记忆'，会长期'记住'营养刺激的信号。"},{"q":"预防孩子肥胖的十招包括？","o":["管好自己的体重再生娃","母乳喂养至少到1周岁","果汁饮料每天封顶","全家11点前熄灯"],"a":[0,1,2,3],"e":"如何防患于未然，避免孩子胖起来呢？我给你总结了十招。第二招，管好自己的体重再生娃。……第四招，母乳喂养，至少到孩子1周岁。……第五招，果汁饮料每天要有封顶。……第十招，全家11点前熄灯，让孩子睡足10个小时。"},{"q":"孕期体重有序增长的推荐运动包括？","o":["骑车","快走","慢跑","瑜伽"],"a":[0,1,2,3],"e":"研究表明，每周3次以上、每次30分钟以上的骑车锻炼，有助于降低孕妇妊娠期体重过度增加的风险和妊娠糖尿病发病率。另外，孕妇还可以在医生的指导下进行快走、慢跑、瑜伽等运动。"},{"q":"产后体重恢复最简单有效的方法包括？","o":["母乳喂养","保持良好情绪","睡眠充足","服用减肥药"],"a":[0,1,2],"e":"②母乳喂养、情绪良好、睡眠充足，是产后体重恢复最简单有效的方法。"},{"q":"增加日常活动量的方案包括？","o":["上班路上安排一段步行或骑车","少乘电梯改爬楼","勤做家务","养狗"],"a":[0,1,2,3],"e":"上班路上安排一段步行、骑车。……在各种日常活动中，爬楼梯是能量消耗最大的一种。……勤做家务。……除此之外，养狗也是一种不错的选择。美国有多篇研究文章显示，由于需要每天遛狗，养狗的人在体重、心脑血管各方面都更健康。"},{"q":"适合在办公室或家里进行的运动包括？","o":["跳绳","有氧操","跑步机","杠铃卧推"],"a":[0,1],"e":"跳绳和有氧操就是两种适合的运动。"},{"q":"“三高”包括？","o":["高血压","高血脂","高血糖","高尿酸"],"a":[0,1,2],"e":"如果你已经有“三高”，也就是高血压、高血脂、高血糖中的一个，甚至多个，那么减肥对你来说，就是一个处方，而不是可减可不减的口号。"},{"q":"高血脂人群降血脂的营养要点包括？","o":["碳水化合物占45%~55%并保证0.5千克蔬菜","脂肪占20%~30%","天然不饱和脂肪酸占脂肪总量一半以上","采用低碳水饮食"],"a":[0,1,2],"e":"想要降低血脂，必须遵循我们前面讲过的营养均衡法则，就是让碳水化合物占摄入总能量的比例维持在45%~55%，其中要有0.5千克的蔬菜；脂肪占20%~30%；剩下是蛋白质。此外，脂肪一定要吃够，并且天然的不饱和脂肪酸要占到脂肪总量一半以上。"},{"q":"强化甲状腺功能的方法包括？","o":["补充硒和锌","规律运动","补充纤维素","大量服用甲状腺素片"],"a":[0,1,2],"e":"医学研究证明，如果只是甲状腺功能弱化，而不是减退，你还有很多其他的方法可用：1.补充硒、锌；2.规律运动；3.补充纤维素。其中，运动可以明显提升各种激素，包括甲状腺素的水平。"},{"q":"富含硒的食物包括？","o":["坚果","金枪鱼和沙丁鱼","蛋黄","牛肉"],"a":[0,1,2,3],"e":"天然食物，比如坚果、金枪鱼、沙丁鱼、蛋黄以及牛肉等都有比较丰富的硒。"},{"q":"阻塞性睡眠呼吸暂停可能引发的疾病包括？","o":["高血压","高血糖","冠心病","大脑功能减退"],"a":[0,1,2,3],"e":"呼吸不畅会导致身体缺氧，从而引发高血压、高血糖、冠心病、大脑功能减退等一系列疾病。"},{"q":"睡眠呼吸暂停的治疗方法包括？","o":["应用呼吸机","采取侧卧位","减肥","大量喝咖啡"],"a":[0,1,2],"e":"确诊之后，你需要根据医生的指导，采取相应的方法，比如应用呼吸机、采取侧卧位、减肥等，改善夜间缺氧的问题。"},{"q":"度过平台期的方法包括？","o":["有点耐心，坚持原有生活方式","交替使用不同方法","增加力量训练并补充蛋白质","极端节食"],"a":[0,1,2],"e":"如果到了平台期，请你做好三件事：有点耐心，方法轮替，以及增加肌肉，让自己的心理和身体做好准备迎接下一轮的减肥。……这时候，建议你比平常增加一倍力量训练，同时补充蛋白质。"},{"q":"关于平台期的正确说法包括？","o":["几乎人人都得经历","是身体开启保护机制","不是因为做错了什么","说明应该放弃"],"a":[0,1,2],"e":"只要减肥，几乎人人都得经历平台期。它的出现不是因为我们做错了什么，而是身体开启了保护自己的机制。"},{"q":"常见的快速减肥方法包括？","o":["辟谷","生酮减肥法","减肥茶","节食+过度运动"],"a":[0,1,2,3],"e":"让我们先来看看具体有哪些方法。1.辟谷……2.生酮减肥法……3.减肥茶……4.节食＋过度运动。其实，以上快速减肥方法的本质都是一样的：让你脱水。"},{"q":"快速减肥的危害包括？","o":["胃肠功能衰退","抵抗力下降","脱发和月经紊乱","增加心梗、脑梗风险"],"a":[0,1,2,3],"e":"除此之外，快速减肥还有很多其他危害，比如常见的胃肠功能衰退；抵抗力下降；月经期延长，月经量变少，甚至停止；皮肤变差；脱发。近年来还有不少研究指出，体重陡然减少或者增加，都会增加心梗、猝死、脑梗的发生率。"},{"q":"人与人之间减肥效果差异的来源包括？","o":["基因差异","血糖效应差异","体脂率差异","生活习惯差异","减肥史差异"],"a":[0,1,2,3,4],"e":"这是因为，减肥的时候，人与人之间的差异实在太大了。第一，基因差异。……第二，血糖效应差异。……第三，体脂率差异。……第四，生活习惯差异。……第五，减肥史差异。"},{"q":"关于“0产品”的正确说法包括？","o":["0蔗糖不等于0糖","0糖不等于0碳水化合物","0脂肪不等于0碳水化合物","0卡路里等于能量安全"],"a":[0,1,2],"e":"0蔗糖≠0糖≠0碳水化合物。……说自己'0蔗糖'的产品，基本都不是0糖。……如果写的是'0糖'，顶多就是没有额外添加糖，不等于这种食品本身不含糖，或者不含碳水化合物。……如果某种食品宣称自己0脂肪，那你就得注意看看食品标签上碳水化合物的量，往往它的碳水化合物含量会极高。"},{"q":"大量运动不能带来大幅度减重的原因包括？","o":["运动消耗的卡路里有限","运动后的能量补偿效应","运动效果递减","运动会增加食欲"],"a":[0,1,2],"e":"第一，运动消耗的卡路里有限。身体活动消耗的能量，占人体能量总消耗的15%~30%……第二，运动后的能量补偿效应。……尤其是BMI较高的人，能量补偿比例会达到49%……第三，运动效果递减的影响。这是因为，动作的熟练化、运动模式的固定化，加上体重下降，造成相同运动强度下，单位时间身体消耗的能量在不断下降。"},{"q":"大量运动的副作用包括？","o":["猝死风险增加","过量运动对身体有损伤","关节越来越健康","代谢越来越高"],"a":[0,1],"e":"大量运动除了减肥效果并不会更好之外，还有两点副作用，一定要小心。其一，有风险，执行需谨慎。……近年来，在猝死的案例中，运动中猝死，尤其是大量剧烈运动后猝死，占据了较大的比例。其二，过量运动对身体有损伤。"},{"q":"关于“让脂肪不吸收”的正确说法包括？","o":["吃进去的脂肪没有不吸收的可能","奥利司他只有30%的吸收抑制作用","没有任何食物提取物效率超过30%","保健品可以稳定抑制脂肪吸收"],"a":[0,1,2],"e":"真相：除了生病，吃进去的脂肪没有不吸收的可能。……目前最管用的脂肪吸收抑制剂，奥利司他，也只有30%的吸收抑制作用。……事实上，不要说30%，全球目前的研究中，可以稳定达到5%的都没有，连安慰剂的效果都不如。"},{"q":"好训练营的基本特征包括？","o":["管吃也管动","不破坏你的健康","方法能长期应用","减重速度越快越好"],"a":[0,1,2],"e":"我给你总结一下好训练营的基本特征：1.管吃也管动。最起码饮食和运动都要管理，这样的训练营才能算基础入门级的。2.不破坏你的健康。……好训练营提供的饮食指导应该很适合你，能让你长期坚持。最重要的判断标准就是有没有节食，饥饿感是不是特别重。"},{"q":"判断训练营是否破坏健康的直观标准包括？","o":["脱发","停经","食欲全无、睡不着觉","特别疲劳"],"a":[0,1,2,3],"e":"比如减得脱发、停经、食欲全无、睡不着觉、特别疲劳，都是判断的标准。"},{"q":"代餐常见的“坑”包括？","o":["燕麦酸奶没有丰富维生素矿物质却冒充代餐","能量棒蛋白质几乎没有全是脂肪碳水","每餐只有120大卡变相节食","把代餐当零食吃"],"a":[0,1,2,3],"e":"比如，像燕麦酸奶这样的健康零食，如果没有添加丰富的维生素和矿物质，是不能替代你的一餐饭的。再比如，很多能量棒也打出代餐的旗号，仔细一看食品标签，蛋白质几乎没有，全是脂肪和碳水化合物。还有不少代餐，为了让你相信它有效果，每餐能量只有120大卡，这就成了变相节食。不少商家会混淆代餐减肥和零食的概念，让你以为把代餐当零食吃就能减肥，事实上那只会增加能量。"},{"q":"中国营养学会代餐食品团体标准的技术指标包括？","o":["能量200~400千卡","蛋白质供能占总能量25%~50%","脂肪供能不超过30%","不得使用氢化油脂"],"a":[0,1,2,3],"e":"能量：每餐代餐食品所提供的能量应为200~400千卡。蛋白质：代餐中蛋白质提供的能量应占总能量的25%~50%。脂肪：代餐中脂肪提供的能量不应超过总能量的30%，来源于饱和脂肪酸的能量不应超过总能量的10%，不得使用氢化油脂，亚油酸供能比不应低于3%。"}]};var curQ=null,ans={},done=false;function shf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a,n){var b=a.slice();shf(b);return b.slice(0,n);}

n++;var id='s_'+i;
h+='<div class="q-card"><div class="q-text"><span class="q-num">'+n+'.</span>'+esc(q.q)+'<span class="q-pts">(1分)</span></div><div class="opts" id="o_'+id+'">';
q.o.forEach(function(o,oi){var l=String.fromCharCode(65+oi);h+='<label onclick="selS('+i+','+oi+')"><input type="radio" name="'+id+'" value="'+oi+'"><span>'+l+'. '+esc(o)+'</span></label>';});
h+='</div></div>';
});
h+='<div class="sec-title"><span>二、多选题</span><span class="pt">20题×3分=60分</span></div>';
curQ.m.forEach(function(q,i){
n++;var id='m_'+i;
h+='<div class="q-card"><div class="q-text"><span class="q-num">'+n+'.</span>'+esc(q.q)+'<span class="q-pts">(3分)</span></div><div class="opts" id="o_'+id+'">';
q.o.forEach(function(o,oi){var l=String.fromCharCode(65+oi);h+='<label><input type="checkbox" onchange="togM('+i+','+oi+')"><span>'+l+'. '+esc(o)+'</span></label>';});
h+='</div></div>';
});
app.innerHTML=h;
}
function selS(i,oi){if(done)return;ans['s_'+i]=[oi];var ls=document.querySelectorAll('#o_s_'+i+' label');ls.forEach(function(el,idx){el.classList.toggle('sel',idx===oi);});upd();}
function togM(i,oi){if(done)return;if(!ans['m_'+i])ans['m_'+i]=[];var a=ans['m_'+i];var idx=a.indexOf(oi);if(idx===-1)a.push(oi);else a.splice(idx,1);var ls=document.querySelectorAll('#o_m_'+i+' label');ls.forEach(function(el,idx2){el.classList.toggle('sel',a.indexOf(idx2)!==-1);});upd();}
function upd(){
var n=0,sc=0;
curQ.s.forEach(function(x,i){if(ans['s_'+i]&&ans['s_'+i].length>0){n++;sc+=1;}});
curQ.m.forEach(function(x,i){if(ans['m_'+i]&&ans['m_'+i].length>0){n++;sc+=3;}});
document.getElementById('answeredCount').textContent=n;
document.getElementById('scoreDisplay').textContent=Math.min(sc,100);
}
function submitQuiz(){
if(done)return;done=true;
var btn=document.getElementById('submitBtn');
btn.disabled=true;btn.textContent='✅ 已提交';
try{var total=0;var dt=[];
curQ.s.forEach(function(q,i){
var ua=ans['s_'+i]||[];
var ok=ua.length>0&&ua[0]===q.a;
if(ok)total+=1;
var ls=document.querySelectorAll('#o_s_'+i+' label');
var userPick=ua.length>0?String.fromCharCode(65+ua[0])+'. '+q.o[ua[0]]:'(未选)';
var correctAns=String.fromCharCode(65+q.a)+'. '+q.o[q.a];
ls.forEach(function(el,oi){if(oi===q.a)el.classList.add('c');if(ua.length>0&&ua[0]===oi&&oi!==q.a)el.classList.add('w');});
dt.push({t:'s',q:q.q,e:q.e||'',ok:ok,pt:ok?1:0,mp:1,ua:userPick,ca:correctAns});
});
curQ.m.forEach(function(q,i){
var ua=ans['m_'+i]||[];
var hit=0,wrong=false;
if(ua.length>0){ua.forEach(function(v){if(q.a.indexOf(v)!==-1){hit++;}else{wrong=true;}});}
var sc=wrong?0:Math.round(300*hit/Math.max(q.a.length,1))/100;
if(sc>3)sc=3;
total+=sc;
var ls=document.querySelectorAll('#o_m_'+i+' label');
var userPick=ua.length>0?ua.map(function(v){return String.fromCharCode(65+v)+'. '+q.o[v]}).join('; '):'(未选)';
var correctAns=q.a.map(function(v){return String.fromCharCode(65+v)+'. '+q.o[v]}).join('; ');
ls.forEach(function(el,oi){if(q.a.indexOf(oi)!==-1)el.classList.add('c');if(ua.indexOf(oi)!==-1&&q.a.indexOf(oi)===-1)el.classList.add('w');});
dt.push({t:'m',q:q.q,e:q.e||'',ok:sc>=3,pt:sc,mp:3,ua:userPick,ca:correctAns});
});
showResults(total,dt);
}catch(e){alert('提交出错：'+e.message);done=false;btn.disabled=false;btn.textContent='📩 重新提交';}
}
function showResults(total,dt){
document.getElementById('app').style.display='none';
var rb=document.getElementById('resultBox');
rb.style.display='block';rb.classList.add('show');
var pass=total>=70;
var h='';
h+='<div class="result-hdr">';
h+='<div class="big-score'+(pass?'':' w')+'">'+total+'<span style="font-size:18px;font-weight:400;color:#6b7280">/100</span></div>';
h+='<div class="score-label">'+(pass?'🎉 恭喜通过！':'😅 未通过，再接再厉！')+'</div>';
var ss=0,ms=0;
dt.forEach(function(d){if(d.t==='s')ss+=d.pt;if(d.t==='m')ms+=d.pt;});
h+='<div class="score-detail"><span>单选: '+ss+'/40</span><span>多选: '+ms+'/60</span></div>';
h+='</div><div class="analysis-section">';
dt.forEach(function(d,i){
h+='<div class="analysis-item">';
h+='<div class="aq">'+(i+1)+'. '+esc(d.q)+' <span class="'+(d.ok?'correct-txt':'wrong-txt')+'">('+d.pt+'/'+d.mp+'分)</span></div>';
if(d.t==='s'||d.t==='m'){
h+='<div class="ad">你的答案：<span class="user-ans">'+esc(d.ua)+'</span>';
if(!d.ok)h+=' | 正确答案：<span class="corr-ans">'+esc(d.ca)+'</span>';
h+='</div>';
if(d.e)h+='<div class="ex"><div class="ex-t">📖 解析（书本原文）</div><div class="ex-b">'+esc(d.e)+'</div></div>';
}
h+='</div>';
});
h+='</div>';
document.getElementById('resultContent').innerHTML=h;
}
function reshuffle(){render();window.scrollTo(0,0);}
render();
</script></body></html>
