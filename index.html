  curQ.h.forEach(function(q,i){
    n++;
    h+="<div class=\"q-card\"><div class=\"q-text\"><span class=\"q-num\">"+n+".</span>"+esc(q.q)+"<span class=\"q-pts\">(20鍒?</span></div><textarea id=\"i_h_"+i+"\" placeholder=\"璇疯緭鍏ヤ綘鐨勫洖绛旓紙鑷冲皯10涓瓧锛?..\" oninput=\"shortA("+i+")\"></textarea></div>";
  });
  app.innerHTML=h;
}

function selS(i,oi){if(done)return;ans["s_"+i]=[oi];var ls=document.querySelectorAll("#o_s_"+i+" label");ls.forEach(function(el,idx){el.classList.toggle("sel",idx===oi);});upd();}
function togM(i,oi){if(done)return;if(!ans["m_"+i])ans["m_"+i]=[];var a=ans["m_"+i];var idx=a.indexOf(oi);if(idx===-1)a.push(oi);else a.splice(idx,1);var ls=document.querySelectorAll("#o_m_"+i+" label");ls.forEach(function(el,idx2){el.classList.toggle("sel",a.indexOf(idx2)!==-1);});upd();}
function fill(i){if(done)return;var el=document.getElementById("i_f_"+i);ans["f_"+i]=el?el.value.trim():"";upd();}
function shortA(i){if(done)return;var el=document.getElementById("i_h_"+i);ans["h_"+i]=el?el.value.trim():"";upd();}

function upd(){
  var n=0;
  curQ.s.forEach(function(x,i){if(ans["s_"+i]&&ans["s_"+i].length>0)n++;});
  curQ.m.forEach(function(x,i){if(ans["m_"+i]&&ans["m_"+i].length>0)n++;});
  curQ.f.forEach(function(x,i){if(ans["f_"+i]&&ans["f_"+i].length>0)n++;});
  curQ.h.forEach(function(x,i){if(ans["h_"+i]&&ans["h_"+i].length>=10)n++;});
  document.getElementById("answeredCount").textContent=n;
  document.getElementById("submitBtn").disabled=(n<26);
}

function submitQuiz(){
  if(done)return;
  done=true;
  var btn=document.getElementById("submitBtn");
  btn.disabled=true;
  btn.textContent="鉁?宸叉彁浜?;
  try{
    var total=0;
    var dt=[];
    
    curQ.s.forEach(function(q,i){
      var ua=ans["s_"+i]||[];
      var ok=ua.length>0&&ua[0]===q.a;
      if(ok)total+=3;
      var ls=document.querySelectorAll("#o_s_"+i+" label");
      ls.forEach(function(el,oi){
        el.classList.remove("sel");
        if(oi===q.a)el.classList.add("c");
        if(ua.length>0&&ua[0]===oi&&oi!==q.a)el.classList.add("w");
      });
      dt.push({t:"s",q:q.q,ok:ok,pt:ok?3:0,mp:3});
    });
    
    curQ.m.forEach(function(q,i){
      var ua=ans["m_"+i]||[];
      var ok=ua.length===q.a.length;
      if(ok){for(var j=0;j<ua.length;j++){if(q.a.indexOf(ua[j])===-1){ok=false;break;}}}
      if(ok)total+=4;
      var ls=document.querySelectorAll("#o_m_"+i+" label");
      ls.forEach(function(el,oi){
        el.classList.remove("sel");
        if(q.a.indexOf(oi)!==-1)el.classList.add("c");
        if(ua.indexOf(oi)!==-1&&q.a.indexOf(oi)===-1)el.classList.add("w");
      });
      dt.push({t:"m",q:q.q,ok:ok,pt:ok?4:0,mp:4});
    });
    
    curQ.f.forEach(function(q,i){
      var el=document.getElementById("i_f_"+i);
      var ua=el?el.value.trim():"";
      var ok=false;
      if(q.a){for(var j=0;j<q.a.length;j++){if(ua.indexOf(q.a[j])!==-1){ok=true;break;}}}
      if(ok)total+=3;
      if(el){el.classList.add(ok?"c":"w");el.readOnly=true;}
      dt.push({t:"f",q:q.q,ok:ok,pt:ok?3:0,mp:3});
    });
    
    curQ.h.forEach(function(q,i){
      var el=document.getElementById("i_h_"+i);
      var ua=el?el.value.trim():"";
      var mc=0;
      if(q.k&&q.k.length>0){for(var j=0;j<q.k.length;j++){if(ua.indexOf(q.k[j])!==-1)mc++;}}
      var sc=Math.round((mc/Math.max(q.k.length,1))*20);
      if(sc<0)sc=0;if(sc>20)sc=20;
      if(ua.length>=10&&sc<2)sc=2;
      total+=sc;
      if(el)el.readOnly=true;
      dt.push({t:"h",q:q.q,ok:sc>=12,pt:sc,mp:20,ref:q.r});
    });
    
    showResults(total,dt);
  }catch(e){
    alert("鎻愪氦鍑洪敊锛?+e.message);
    done=false;
    btn.disabled=false;
    btn.textContent="馃摡 閲嶆柊鎻愪氦";
  }
}

function showResults(total,dt){
  document.getElementById("app").style.display="none";
  var rb=document.getElementById("resultBox");
  rb.style.display="block";rb.classList.add("show");
  var pass=total>=60;
  var h="";
  h+="<div class=\"result-hdr\">";
  h+="<div class=\"big-score"+(pass?"":" w")+"\">"+total+"<span style=\"font-size:18px;font-weight:400;color:#6b7280\">/100</span></div>";
  h+="<div class=\"score-label\">"+(pass?"馃帀 鎭枩閫氳繃锛?:"馃槄 鏈€氳繃锛屽啀鎺ュ啀鍘夛紒")+"</div>";
  var ss=0,ms=0,fs=0,hs=0;
  dt.forEach(function(d){if(d.t==="s")ss+=d.pt;if(d.t==="m")ms+=d.pt;if(d.t==="f")fs+=d.pt;if(d.t==="h")hs+=d.pt;});
  h+="<div class=\"score-detail\"><span>鍗曢€? "+ss+"/30</span><span>澶氶€? "+ms+"/20</span><span>濉┖: "+fs+"/30</span><span>绠€绛? "+hs+"/20</span></div>";
  h+="</div><div class=\"analysis-section\">";
  dt.forEach(function(d,i){
    h+="<div class=\"analysis-item\">";
    h+="<div class=\"aq\">"+(i+1)+". "+esc(d.q)+" <span class=\""+(d.ok?"correct-txt":"wrong-txt")+"\">("+d.pt+"/"+d.mp+"鍒?</span></div>";
    if(d.t==="h"&&d.ref){h+="<div class=\"short-ref\"><strong>鍙傝€冪瓟妗堬細</strong>"+esc(d.ref)+"</div>";}
    h+="</div>";
  });
  h+="</div>";
  document.getElementById("resultContent").innerHTML=h;
}

function reshuffle(){render();window.scrollTo(0,0);}
render();
</script>
